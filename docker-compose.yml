version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: websocket-study-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: websocket_study
      POSTGRES_USER: websocket
      POSTGRES_PASSWORD: websocket
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres-data:
