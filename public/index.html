<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket 채팅 예제</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #1a1a2e;
    }

    #status {
      font-size: 0.85rem;
      margin-bottom: 16px;
      padding: 4px 12px;
      border-radius: 12px;
      background: #ffd6d6;
      color: #c0392b;
      transition: background 0.3s, color 0.3s;
    }

    #status.connected {
      background: #d4edda;
      color: #155724;
    }

    #chat-box {
      width: 100%;
      max-width: 640px;
      height: 420px;
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
      word-break: break-word;
      line-height: 1.4;
      font-size: 0.9rem;
    }

    .msg.system {
      align-self: center;
      background: #e9ecef;
      color: #6c757d;
      font-size: 0.8rem;
      border-radius: 20px;
      padding: 4px 14px;
    }

    .msg.mine {
      align-self: flex-end;
      background: #0d6efd;
      color: #fff;
    }

    .msg.others {
      align-self: flex-start;
      background: #e9ecef;
      color: #212529;
    }

    .msg.echo {
      align-self: center;
      background: #fff3cd;
      color: #856404;
      font-style: italic;
    }

    .sender {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    #controls {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #name-row {
      display: flex;
      gap: 8px;
    }

    #nickname {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    #input-row {
      display: flex;
      gap: 8px;
    }

    #msg-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    #msg-input:focus { border-color: #0d6efd; }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #send-btn  { background: #0d6efd; color: #fff; }
    #echo-btn  { background: #6c757d; color: #fff; }
    #clear-btn { background: #dee2e6; color: #212529; }

    #mode-info {
      font-size: 0.78rem;
      color: #6c757d;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🔌 WebSocket 채팅 예제</h1>
  <div id="status">연결 중…</div>

  <div id="chat-box"></div>

  <div id="controls">
    <div id="name-row">
      <input id="nickname" type="text" placeholder="닉네임 입력" maxlength="20" value="익명" />
      <button id="clear-btn" onclick="clearChat()">지우기</button>
    </div>
    <div id="input-row">
      <input id="msg-input" type="text" placeholder="메시지 입력 후 Enter 또는 전송" disabled />
      <button id="send-btn" onclick="sendChat()" disabled>전송</button>
      <button id="echo-btn" onclick="sendEcho()" disabled>에코</button>
    </div>
    <p id="mode-info">
      <strong>전송</strong>: 모든 접속자에게 브로드캐스트 &nbsp;|&nbsp;
      <strong>에코</strong>: 서버가 본인에게만 그대로 돌려줌
    </p>
  </div>

  <script>
    const statusEl  = document.getElementById('status');
    const chatBox   = document.getElementById('chat-box');
    const msgInput  = document.getElementById('msg-input');
    const sendBtn   = document.getElementById('send-btn');
    const echoBtn   = document.getElementById('echo-btn');
    const nicknameEl = document.getElementById('nickname');

    const WS_URL = `ws://${location.host}`;
    let ws;

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        statusEl.textContent = '연결됨 ✅';
        statusEl.className = 'connected';
        msgInput.disabled = false;
        sendBtn.disabled = false;
        echoBtn.disabled = false;
        appendMessage({ type: 'system', message: '서버에 연결되었습니다.' });
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          appendMessage(data);
        } catch {
          appendMessage({ type: 'system', message: event.data });
        }
      };

      ws.onclose = () => {
        statusEl.textContent = '연결 끊김 ❌';
        statusEl.className = '';
        msgInput.disabled = true;
        sendBtn.disabled = true;
        echoBtn.disabled = true;
        appendMessage({ type: 'system', message: '서버 연결이 끊겼습니다. 3초 후 재연결 시도…' });
        setTimeout(connect, 3000);
      };

      ws.onerror = (err) => {
        console.error('WebSocket 오류:', err);
      };
    }

    function appendMessage(data) {
      const div = document.createElement('div');
      const myName = nicknameEl.value.trim() || '익명';

      if (data.type === 'system') {
        div.className = 'msg system';
        div.textContent = data.message;
      } else if (data.type === 'echo') {
        div.className = 'msg echo';
        div.textContent = `[에코] ${data.message}`;
      } else if (data.type === 'chat') {
        const isMe = data.sender === myName;
        div.className = `msg ${isMe ? 'mine' : 'others'}`;
        if (!isMe) {
          const senderEl = document.createElement('div');
          senderEl.className = 'sender';
          senderEl.textContent = data.sender;
          div.appendChild(senderEl);
        }
        const textEl = document.createElement('div');
        textEl.textContent = data.message;
        div.appendChild(textEl);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendChat() {
      const text = msgInput.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      const sender = nicknameEl.value.trim() || '익명';
      ws.send(JSON.stringify({ type: 'chat', sender, message: text }));
      msgInput.value = '';
      msgInput.focus();
    }

    function sendEcho() {
      const text = msgInput.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'echo', message: text }));
      msgInput.value = '';
      msgInput.focus();
    }

    function clearChat() {
      chatBox.innerHTML = '';
    }

    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChat();
    });

    connect();
  </script>
</body>
</html>
